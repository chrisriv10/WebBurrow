<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="popup.css"><title>WebBurrow</title></head><body>
<header><div class="mark">WB</div><div><small>WEBBURROW COMPANION</small><h1>Send it home</h1></div><span id="status" class="status">Checking…</span></header>
<main>
  <section><label>Current page<input id="title" maxlength="200"></label><div class="grid"><label>Collection<input id="collection" maxlength="40" placeholder="Optional"></label><label>Object<select id="archetype"><option value="">Automatic</option><option>terminal</option><option>tv</option><option>book</option><option>poster</option><option>arcade</option><option>pedestal</option></select></label></div><label class="check"><input id="favorite" type="checkbox"> Add to favorites</label><button id="send-page" class="primary">Add current page</button></section>
  <section><div class="row"><div><strong>Tabs workspace</strong><p>Choose tabs after granting one optional permission.</p></div><button id="load-tabs">Choose</button></div><div id="tabs" class="list"></div><button id="send-tabs" class="primary hidden">Create temporary room</button></section>
  <section><div class="row"><div><strong>Browser bookmarks</strong><p>Preview locally before anything is added.</p></div><button id="load-bookmarks">Preview</button></div><div id="bookmarks" class="list"></div><button id="send-bookmarks" class="primary hidden">Review in WebBurrow</button></section>
</main><p id="message" role="status"></p><script src="popup.js"></script></body></html>
