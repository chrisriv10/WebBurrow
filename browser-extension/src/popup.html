<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="popup.css"><title>WebBurrow</title></head><body>
<header><div class="mark">WB</div><div><small>WEBBURROW COMPANION</small><h1>Send it home</h1></div><span id="status" class="status">Checking…</span></header>
<main>
  <section><label>Current page<input id="title" maxlength="200"></label><div class="grid"><label>Room<select id="room"><option value="">Current room</option></select></label><label>Collection<input id="collection" list="collections" maxlength="40" placeholder="Optional"><datalist id="collections"></datalist></label><label>Object<select id="archetype"><option value="">Automatic</option><option>terminal</option><option>tv</option><option>book</option><option>poster</option><option>arcade</option><option>pedestal</option><option>laptop</option><option>radio</option><option>file-box</option><option>desk-monitor</option><option>wall-display</option><option>tablet</option><option>compact-portal</option></select></label><label>Color<input id="color" type="color" value="#8be6ff"></label></div><div class="checks"><label class="check"><input id="favorite" type="checkbox"> Favorite</label><label class="check"><input id="include-icon" type="checkbox"> Include page icon</label></div><button id="send-page" class="primary">Add current page</button></section>
  <section><div class="row"><div><strong>Tabs workspace</strong><p>Selected tabs, this window, or one tab group.</p></div><button id="load-tabs">Choose</button></div><div class="grid"><label>Send<select id="scope"><option value="selection">Selected tabs</option><option value="window">Current window</option><option value="group">Tab group</option></select></label><label>Behavior<select id="mode"><option value="create">New workspace</option><option value="append">Append</option><option value="replace">Replace</option></select></label></div><label class="top-gap">Workspace name<input id="workspace-name" maxlength="60" value="Browser session"></label><label class="top-gap">Existing temporary workspace<select id="workspace"><option value="">Create a new workspace</option></select></label><div id="groups" class="list hidden"></div><div id="tabs" class="list"></div><button id="send-tabs" class="primary hidden">Send workspace</button></section>
  <section><div class="row"><div><strong>Browser bookmarks</strong><p>Preview locally before anything is added.</p></div><button id="load-bookmarks">Preview</button></div><div id="bookmarks" class="list"></div><button id="send-bookmarks" class="primary hidden">Review in WebBurrow</button></section>
</main><p id="message" role="status"></p><script src="popup.js"></script></body></html>
